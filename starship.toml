palette = 'apple'

[palettes.apple]
apple_color1 = '#6fa0eb'
apple_color2 = '#e05959'


[character]
success_symbol = '[➜](bold green) [ ](apple_color1)'
error_symbol = '[➜](bold green) [ ](apple_color2)'

[os]
disabled = true

[username]
format = '🐷'
show_always = true

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue) on [$hostname](bold red) in '